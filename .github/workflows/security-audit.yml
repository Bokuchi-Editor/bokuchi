name: Security Audit

on:
  schedule:
    # 毎週月曜日の午前9時（JST）に実行
    - cron: "0 0 * * 1"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (toolchain via input)
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Configure Rust environment
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npx audit-ci --moderate

      - name: Install Rust dependencies
        run: |
          cd src-tauri
          echo "=== Environment Information ==="
          cargo --version
          rustc --version
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== Cargo.toml content ==="
          cat Cargo.toml
          echo "=== Running cargo check ==="
          cargo check --verbose --message-format=json 2>&1 || {
            echo "=== cargo check failed ==="
            echo "=== Trying cargo build for more details ==="
            cargo build --verbose 2>&1 || true
            echo "=== Checking dependencies ==="
            cargo tree || true
            exit 1
          }

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test --verbose -- --nocapture

      - name: Run cargo audit
        run: |
          cd src-tauri
          # glibのunsoundness警告はTauriの制約により無視
          cargo audit --ignore RUSTSEC-2024-0429 || echo "cargo audit completed with ignored warnings"

      - name: Check for outdated packages
        run: |
          echo "Checking for outdated npm packages..."
          npm outdated || true

          echo "Checking for outdated cargo packages..."
          cd src-tauri
          cargo outdated || true

      - name: Upload audit results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-audit-results
          path: |
            npm-audit-results.json
            src-tauri/Cargo.lock
